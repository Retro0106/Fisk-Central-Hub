<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#0f172a">Flow 1: Organization search</text>
  <text x="30" y="62" font-size="13" fill="#64748b">Search by interest, filter by category, open an org, join it, see its events.</text>

  <!-- Screen 1: Directory -->
  <g transform="translate(30,85)">
    <rect width="360" height="450" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="12" y="-8" font-size="13" font-weight="bold" fill="#334155">1. Organization directory</text>
    <rect x="16" y="16" width="200" height="18" fill="#94a3b8"/>
    <text x="250" y="30" font-size="10" fill="#1d4ed8">Upcoming events</text>
    <rect x="16" y="48" width="328" height="30" rx="5" fill="#fff" stroke="#334155"/>
    <text x="26" y="68" font-size="11" fill="#64748b">"What are you interested in?" e.g. volunteering</text>
    <g font-size="9">
      <rect x="16" y="88" width="36" height="20" rx="4" fill="#fbbf24"/><text x="24" y="102">All</text>
      <rect x="58" y="88" width="58" height="20" rx="4" fill="#e2e8f0"/><text x="64" y="102">Academic</text>
      <rect x="122" y="88" width="54" height="20" rx="4" fill="#e2e8f0"/><text x="128" y="102">Cultural</text>
      <rect x="182" y="88" width="50" height="20" rx="4" fill="#e2e8f0"/><text x="188" y="102">Service</text>
      <rect x="238" y="88" width="40" height="20" rx="4" fill="#e2e8f0"/><text x="246" y="102">Arts</text>
    </g>
    <g font-size="10">
      <rect x="16" y="122" width="160" height="96" rx="6" fill="#fff" stroke="#94a3b8"/>
      <rect x="26" y="132" width="30" height="30" rx="5" fill="#cbd5e1"/><text x="62" y="146">Org name</text><text x="62" y="160" fill="#64748b">Category | 12 members</text>
      <rect x="26" y="172" width="140" height="8" fill="#e2e8f0"/><rect x="26" y="186" width="110" height="8" fill="#e2e8f0"/>
      <rect x="184" y="122" width="160" height="96" rx="6" fill="#fff" stroke="#94a3b8"/>
      <rect x="194" y="132" width="30" height="30" rx="5" fill="#cbd5e1"/><text x="230" y="146">Org name</text><text x="230" y="160" fill="#64748b">Joined</text>
      <rect x="194" y="172" width="140" height="8" fill="#e2e8f0"/><rect x="194" y="186" width="110" height="8" fill="#e2e8f0"/>
      <rect x="16" y="226" width="160" height="96" rx="6" fill="#fff" stroke="#94a3b8"/>
      <rect x="184" y="226" width="160" height="96" rx="6" fill="#fff" stroke="#94a3b8"/>
      <rect x="16" y="330" width="160" height="96" rx="6" fill="#fff" stroke="#94a3b8"/>
      <rect x="184" y="330" width="160" height="96" rx="6" fill="#fff" stroke="#94a3b8"/>
    </g>
  </g>

  <!-- Screen 2: Org detail -->
  <g transform="translate(420,85)">
    <rect width="360" height="450" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="12" y="-8" font-size="13" font-weight="bold" fill="#334155">2. Organization page</text>
    <text x="16" y="28" font-size="10" fill="#64748b">&lt; All organizations</text>
    <rect x="16" y="40" width="54" height="54" rx="8" fill="#cbd5e1"/>
    <rect x="80" y="44" width="160" height="16" fill="#94a3b8"/>
    <text x="80" y="82" font-size="10" fill="#475569">Category | 24 members</text>
    <rect x="252" y="52" width="92" height="28" rx="5" fill="#fbbf24"/><text x="268" y="70" font-size="11">Join</text>
    <rect x="16" y="108" width="210" height="110" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="24" y="128" font-size="11" font-weight="bold">About</text>
    <g fill="#e2e8f0"><rect x="24" y="138" width="190" height="8"/><rect x="24" y="152" width="170" height="8"/><rect x="24" y="166" width="180" height="8"/></g>
    <text x="24" y="200" font-size="10" fill="#1d4ed8">contact email</text>
    <rect x="16" y="226" width="210" height="200" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="24" y="246" font-size="11" font-weight="bold">Upcoming events</text>
    <text x="146" y="246" font-size="9" fill="#1d4ed8">+ Post event</text>
    <text x="146" y="258" font-size="8" fill="#64748b">(officers only)</text>
    <g font-size="9"><rect x="24" y="266" width="36" height="36" rx="4" fill="#e2e8f0"/><text x="30" y="288">NOV</text><rect x="66" y="272" width="140" height="8" fill="#cbd5e1"/><rect x="66" y="286" width="100" height="8" fill="#e2e8f0"/>
    <rect x="24" y="312" width="36" height="36" rx="4" fill="#e2e8f0"/><text x="30" y="334">DEC</text><rect x="66" y="318" width="140" height="8" fill="#cbd5e1"/><rect x="66" y="332" width="100" height="8" fill="#e2e8f0"/></g>
    <text x="24" y="380" font-size="10" fill="#64748b">&gt; Past events</text>
    <rect x="234" y="108" width="110" height="318" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="242" y="128" font-size="11" font-weight="bold">Members</text>
    <g fill="#cbd5e1"><circle cx="252" cy="152" r="10"/><circle cx="252" cy="182" r="10"/><circle cx="252" cy="212" r="10"/><circle cx="252" cy="242" r="10"/></g>
    <g font-size="9"><text x="268" y="155">Name</text><text x="268" y="185">Name</text><text x="268" y="215">Name</text><text x="268" y="245">Name</text></g>
    <rect x="306" y="146" width="32" height="12" rx="3" fill="#fde68a"/><text x="309" y="155" font-size="8">admin</text>
  </g>

  <!-- Screen 3: Events -->
  <g transform="translate(810,85)">
    <rect width="360" height="450" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="12" y="-8" font-size="13" font-weight="bold" fill="#334155">3. All upcoming events</text>
    <rect x="16" y="16" width="180" height="18" fill="#94a3b8"/>
    <rect x="216" y="18" width="12" height="12" fill="#fff" stroke="#334155"/><text x="232" y="28" font-size="10">Only my orgs</text>
    <rect x="16" y="50" width="328" height="380" rx="6" fill="#fff" stroke="#94a3b8"/>
    <g font-size="9">
      <rect x="28" y="64" width="40" height="40" rx="4" fill="#e2e8f0"/><rect x="78" y="70" width="180" height="8" fill="#cbd5e1"/><rect x="78" y="84" width="130" height="8" fill="#e2e8f0"/><text x="78" y="102" fill="#1d4ed8">Hosting org</text>
      <rect x="28" y="120" width="40" height="40" rx="4" fill="#e2e8f0"/><rect x="78" y="126" width="180" height="8" fill="#cbd5e1"/><rect x="78" y="140" width="130" height="8" fill="#e2e8f0"/><text x="78" y="158" fill="#1d4ed8">Hosting org</text>
      <rect x="28" y="176" width="40" height="40" rx="4" fill="#e2e8f0"/><rect x="78" y="182" width="180" height="8" fill="#cbd5e1"/><rect x="78" y="196" width="130" height="8" fill="#e2e8f0"/><text x="78" y="214" fill="#1d4ed8">Hosting org</text>
      <rect x="28" y="232" width="40" height="40" rx="4" fill="#e2e8f0"/><rect x="78" y="238" width="180" height="8" fill="#cbd5e1"/><rect x="78" y="252" width="130" height="8" fill="#e2e8f0"/><text x="78" y="270" fill="#1d4ed8">Hosting org</text>
    </g>
    <text x="28" y="320" font-size="10" fill="#475569">Each row: date block, title, time, location,</text>
    <text x="28" y="336" font-size="10" fill="#475569">and a link back to the hosting organization.</text>
  </g>

  <g stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M392 300 L418 300"/><path d="M782 300 L808 300"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
</svg>
