<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#0f172a">Flow 2: Marketplace listing</text>
  <text x="30" y="62" font-size="13" fill="#64748b">Browse with meaning-based search, open an item, message the seller. Sellers post from the same screens.</text>

  <!-- Screen 1: Browse -->
  <g transform="translate(30,85)">
    <rect width="360" height="450" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="12" y="-8" font-size="13" font-weight="bold" fill="#334155">1. Browse and search</text>
    <rect x="16" y="16" width="140" height="18" fill="#94a3b8"/>
    <rect x="200" y="12" width="60" height="26" rx="5" fill="#fff" stroke="#334155"/><text x="212" y="29" font-size="10">Cart (1)</text>
    <rect x="266" y="12" width="78" height="26" rx="5" fill="#fbbf24"/><text x="272" y="29" font-size="10">+ Sell item</text>
    <rect x="16" y="50" width="328" height="30" rx="5" fill="#fff" stroke="#334155"/>
    <text x="26" y="69" font-size="10" fill="#64748b">"something to keep drinks cold in my dorm"</text>
    <rect x="16" y="88" width="160" height="24" rx="4" fill="#fff" stroke="#94a3b8"/><text x="24" y="104" font-size="10">All categories v</text>
    <rect x="184" y="88" width="160" height="24" rx="4" fill="#fff" stroke="#94a3b8"/><text x="192" y="104" font-size="10">Best match v</text>
    <g font-size="9">
      <rect x="16" y="124" width="104" height="148" rx="6" fill="#fff" stroke="#94a3b8"/><rect x="16" y="124" width="104" height="94" rx="6" fill="#e2e8f0"/><text x="22" y="234">Mini fridge</text><text x="22" y="250" font-weight="bold">$70</text><text x="22" y="264" fill="#64748b">Seller name</text>
      <rect x="128" y="124" width="104" height="148" rx="6" fill="#fff" stroke="#94a3b8"/><rect x="128" y="124" width="104" height="94" rx="6" fill="#e2e8f0"/><text x="134" y="234">Item title</text><text x="134" y="250" font-weight="bold">$35</text>
      <rect x="240" y="124" width="104" height="148" rx="6" fill="#fff" stroke="#94a3b8"/><rect x="240" y="124" width="104" height="94" rx="6" fill="#e2e8f0"/><text x="246" y="234">Item title</text><text x="246" y="250" font-weight="bold">$18</text>
      <rect x="16" y="280" width="104" height="148" rx="6" fill="#fff" stroke="#94a3b8"/><rect x="128" y="280" width="104" height="148" rx="6" fill="#fff" stroke="#94a3b8"/><rect x="240" y="280" width="104" height="148" rx="6" fill="#fff" stroke="#94a3b8"/>
    </g>
  </g>

  <!-- Screen 2: Item detail -->
  <g transform="translate(420,85)">
    <rect width="360" height="450" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="12" y="-8" font-size="13" font-weight="bold" fill="#334155">2. Item detail</text>
    <text x="16" y="28" font-size="10" fill="#64748b">&lt; Back to marketplace</text>
    <rect x="16" y="40" width="160" height="160" rx="8" fill="#e2e8f0"/><text x="70" y="124" font-size="10">photo</text>
    <g font-size="8"><rect x="186" y="40" width="54" height="16" rx="3" fill="#dbeafe"/><text x="190" y="51">Dorm &amp; Home</text><rect x="246" y="40" width="34" height="16" rx="3" fill="#e2e8f0"/><text x="250" y="51">Good</text></g>
    <rect x="186" y="66" width="150" height="16" fill="#94a3b8"/>
    <text x="186" y="112" font-size="20" font-weight="bold" fill="#b45309">$70</text>
    <g fill="#e2e8f0"><rect x="186" y="126" width="150" height="8"/><rect x="186" y="140" width="130" height="8"/><rect x="186" y="154" width="140" height="8"/></g>
    <rect x="16" y="214" width="328" height="60" rx="6" fill="#fff" stroke="#94a3b8"/>
    <circle cx="44" cy="244" r="16" fill="#cbd5e1"/>
    <text x="70" y="240" font-size="11" font-weight="bold">Seller name</text><text x="70" y="256" font-size="9" fill="#64748b">Major | Class of 2029</text>
    <rect x="256" y="234" width="78" height="20" rx="4" fill="#d1fae5"/><text x="262" y="248" font-size="9">Verified Fisk</text>
    <rect x="16" y="290" width="160" height="34" rx="5" fill="#fbbf24"/><text x="44" y="311" font-size="11">Message seller</text>
    <rect x="184" y="290" width="160" height="34" rx="5" fill="#fff" stroke="#334155"/><text x="226" y="311" font-size="11">Add to cart</text>
    <text x="16" y="360" font-size="10" fill="#475569">If you are the seller, the buttons become:</text>
    <rect x="16" y="372" width="120" height="28" rx="5" fill="#fff" stroke="#334155" stroke-dasharray="4 3"/><text x="28" y="390" font-size="10">Mark as sold</text>
    <rect x="144" y="372" width="120" height="28" rx="5" fill="#fff" stroke="#b91c1c" stroke-dasharray="4 3"/><text x="160" y="390" font-size="10" fill="#b91c1c">Delete listing</text>
  </g>

  <!-- Screen 3: Message seller -->
  <g transform="translate(810,85)">
    <rect width="360" height="450" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="12" y="-8" font-size="13" font-weight="bold" fill="#334155">3. Message the seller</text>
    <rect x="16" y="16" width="110" height="418" rx="6" fill="#fff" stroke="#94a3b8"/>
    <rect x="24" y="24" width="94" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="30" y="38" font-size="9" fill="#64748b">Search people</text>
    <g font-size="9"><circle cx="38" cy="66" r="10" fill="#cbd5e1"/><text x="54" y="64">Seller</text><text x="54" y="76" fill="#64748b">Hi! Is it...</text>
    <circle cx="38" cy="102" r="10" fill="#cbd5e1"/><text x="54" y="100">Tutor</text><text x="54" y="112" fill="#64748b">See you...</text></g>
    <rect x="134" y="16" width="210" height="418" rx="6" fill="#fff" stroke="#94a3b8"/>
    <circle cx="154" cy="40" r="10" fill="#cbd5e1"/><text x="170" y="44" font-size="11" font-weight="bold">Seller name</text>
    <line x1="134" y1="60" x2="344" y2="60" stroke="#e2e8f0"/>
    <rect x="146" y="76" width="130" height="28" rx="10" fill="#e2e8f0"/>
    <rect x="200" y="114" width="132" height="28" rx="10" fill="#bfdbfe"/>
    <rect x="146" y="390" width="140" height="30" rx="5" fill="#fff" stroke="#334155"/>
    <text x="152" y="409" font-size="8" fill="#64748b">Hi! Is "Mini fridge" still available?</text>
    <rect x="292" y="390" width="44" height="30" rx="5" fill="#1d4ed8"/><text x="300" y="409" font-size="10" fill="#fff">Send</text>
    <text x="146" y="374" font-size="8" fill="#475569">Draft pre-filled from the listing</text>
  </g>

  <g stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M392 300 L418 300"/><path d="M782 300 L808 300"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
</svg>
