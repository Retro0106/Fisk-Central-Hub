<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#0f172a">Flow 0: Landing, sign-up, and the Hub home</text>
  <text x="30" y="62" font-size="13" fill="#64748b">Low-fidelity wireframe. Boxes are placeholders, not final visuals.</text>

  <!-- Screen 1: Landing -->
  <g transform="translate(30,85)">
    <rect width="360" height="450" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="12" y="-8" font-size="13" font-weight="bold" fill="#334155">1. Landing (logged out)</text>
    <rect x="16" y="16" width="120" height="18" rx="4" fill="#cbd5e1"/><text x="22" y="29" font-size="11">Logo: Fisk Central Hub</text>
    <rect x="16" y="54" width="190" height="16" fill="#94a3b8"/><rect x="16" y="76" width="160" height="16" fill="#94a3b8"/>
    <text x="16" y="110" font-size="11" fill="#475569">Headline + one-line pitch</text>
    <g font-size="10" fill="#334155">
      <rect x="16" y="124" width="90" height="56" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="22" y="156">Organizations</text>
      <rect x="112" y="124" width="90" height="56" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="118" y="156">Marketplace</text>
      <rect x="16" y="186" width="90" height="56" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="22" y="218">Peer tutoring</text>
      <rect x="112" y="186" width="90" height="56" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="118" y="218">Verified Fisk</text>
    </g>
    <rect x="216" y="54" width="128" height="230" rx="8" fill="#ffffff" stroke="#334155"/>
    <text x="226" y="76" font-size="12" font-weight="bold">Log in</text>
    <rect x="226" y="88" width="108" height="24" rx="4" fill="#fff" stroke="#94a3b8"/><text x="232" y="104" font-size="10" fill="#64748b">you@my.fisk.edu</text>
    <rect x="226" y="120" width="108" height="24" rx="4" fill="#fff" stroke="#94a3b8"/><text x="232" y="136" font-size="10" fill="#64748b">password</text>
    <rect x="226" y="156" width="108" height="26" rx="4" fill="#1d4ed8"/><text x="258" y="173" font-size="11" fill="#fff">Log in</text>
    <text x="226" y="206" font-size="10" fill="#1d4ed8">Create an account</text>
    <text x="16" y="320" font-size="11" fill="#475569">Sign-up only accepts @my.fisk.edu.</text>
    <text x="16" y="338" font-size="11" fill="#475569">After sign-up: "Check your Fisk email" screen.</text>
    <text x="16" y="356" font-size="11" fill="#475569">Link in email verifies and logs you in.</text>
  </g>

  <!-- Screen 2: Check email -->
  <g transform="translate(420,85)">
    <rect width="360" height="450" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="12" y="-8" font-size="13" font-weight="bold" fill="#334155">2. Verify Fisk email</text>
    <circle cx="180" cy="110" r="32" fill="#e2e8f0" stroke="#94a3b8"/><text x="160" y="115" font-size="11">mail icon</text>
    <rect x="70" y="166" width="220" height="18" fill="#94a3b8"/>
    <text x="72" y="214" font-size="11" fill="#475569">"We sent a link to you@my.fisk.edu"</text>
    <rect x="120" y="236" width="120" height="28" rx="4" fill="#fff" stroke="#334155"/><text x="148" y="254" font-size="11">Resend link</text>
    <rect x="30" y="300" width="300" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="5 4"/>
    <text x="40" y="322" font-size="11" font-weight="bold" fill="#92400e">Development mode only</text>
    <text x="40" y="342" font-size="10" fill="#92400e">Shows the verification link so the team</text>
    <text x="40" y="358" font-size="10" fill="#92400e">can test without a real mail server.</text>
  </g>

  <!-- Screen 3: Hub home -->
  <g transform="translate(810,85)">
    <rect width="360" height="450" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="12" y="-8" font-size="13" font-weight="bold" fill="#334155">3. Hub home (logged in)</text>
    <rect x="0" y="0" width="360" height="40" rx="10" fill="#e2e8f0"/>
    <text x="10" y="25" font-size="10">Logo | Orgs Market Tutoring Messages</text>
    <rect x="200" y="10" width="120" height="20" rx="4" fill="#fff" stroke="#94a3b8"/><text x="206" y="24" font-size="9" fill="#64748b">Search everything...</text>
    <circle cx="338" cy="20" r="10" fill="#cbd5e1"/>
    <rect x="16" y="56" width="180" height="16" fill="#94a3b8"/><text x="16" y="90" font-size="10" fill="#475569">"Welcome back, Marcus"</text>
    <g font-size="10">
      <rect x="16" y="102" width="104" height="80" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="24" y="146">Organizations</text>
      <rect x="128" y="102" width="104" height="80" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="138" y="146">Marketplace</text>
      <rect x="240" y="102" width="104" height="80" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="248" y="146">Peer tutoring</text>
    </g>
    <rect x="16" y="198" width="160" height="230" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="24" y="218" font-size="11" font-weight="bold">Upcoming events</text>
    <g fill="#e2e8f0"><rect x="24" y="230" width="144" height="36" rx="4"/><rect x="24" y="274" width="144" height="36" rx="4"/><rect x="24" y="318" width="144" height="36" rx="4"/></g>
    <rect x="184" y="198" width="160" height="230" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="192" y="218" font-size="11" font-weight="bold">New in marketplace</text>
    <g fill="#e2e8f0"><rect x="192" y="230" width="68" height="80" rx="4"/><rect x="268" y="230" width="68" height="80" rx="4"/><rect x="192" y="318" width="68" height="80" rx="4"/><rect x="268" y="318" width="68" height="80" rx="4"/></g>
  </g>

  <g stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M392 300 L418 300"/><path d="M782 300 L808 300"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
</svg>
